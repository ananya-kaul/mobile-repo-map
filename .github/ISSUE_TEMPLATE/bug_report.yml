name: Bug report
description: The CLI crashed, hung, printed an error, or the report is broken.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If the problem is a screen, route, API call or cycle that was detected wrongly or missed, please use the **Wrong or missed detection** template instead.

        Please remove proprietary code, API keys and internal URLs before posting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: The exact command, including options.
      placeholder: npx mobile-repo-map . --format html,md
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Console output or stack trace
      description: Paste the full output. This is formatted as code automatically.
      render: text

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        If the crash depends on specific source code, a minimal Dart or Swift snippet or a link to a public repo helps a lot.

  - type: input
    id: version
    attributes:
      label: mobile-repo-map version
      description: Output of `npx mobile-repo-map --version`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: v20.x
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: project
    attributes:
      label: Project type
      options:
        - Flutter / Dart
        - iOS / Swift
        - Both (monorepo or Flutter app with native Swift code)
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: I removed proprietary code, secrets and internal URLs from this report.
          required: true
